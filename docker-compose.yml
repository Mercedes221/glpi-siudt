services:
  app:
    build:
      context: .
    image: glpi-siudt:10.0.18
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /var/www/html/files/_cache
        /var/www/html/files/_cron
        /var/www/html/files/_dumps
        /var/www/html/files/_graphs
        /var/www/html/files/_locales
        /var/www/html/files/_lock
        /var/www/html/files/_log
        /var/www/html/files/_pictures
        /var/www/html/files/_plugins
        /var/www/html/files/_rss
        /var/www/html/files/_sessions
        /var/www/html/files/_tmp
        /var/www/html/files/_uploads
        /var/www/html/files/_inventories
        /var/www/html/marketplace
        &&
        chown www-data:www-data
        /var/www/html/files
        /var/www/html/files/_cache
        /var/www/html/files/_cron
        /var/www/html/files/_dumps
        /var/www/html/files/_graphs
        /var/www/html/files/_locales
        /var/www/html/files/_lock
        /var/www/html/files/_log
        /var/www/html/files/_pictures
        /var/www/html/files/_plugins
        /var/www/html/files/_rss
        /var/www/html/files/_sessions
        /var/www/html/files/_tmp
        /var/www/html/files/_uploads
        /var/www/html/files/_inventories
        /var/www/html/marketplace
        &&
        exec apache2-foreground
    volumes:
      - glpi_config:/var/www/html/config
      - glpi_files:/var/www/html/files

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?Set GLPI_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - glpi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"

volumes:
  glpi_config:
  glpi_files:
  glpi_db_data:
